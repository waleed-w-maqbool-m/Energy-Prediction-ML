[project]
name = "pjm-energy-forecast"
version = "1.0.0"
description = "Day-ahead and 7-day electricity demand forecasting for PJM East with calibrated prediction intervals"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["B008"]  # FastAPI declares parameters via Query(...) defaults
