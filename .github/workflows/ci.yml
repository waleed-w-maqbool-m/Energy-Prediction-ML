name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests and JS parity
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (features, forecasts, API, Streamlit smoke test, model quality gates, JS-vs-Python parity)
        run: pytest

  worker:
    name: Worker tests and deploy dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Worker API tests
        run: npm test
      - name: Validate the Cloudflare deploy (no credentials needed)
        run: npx wrangler deploy --dry-run
